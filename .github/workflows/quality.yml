name: HCSC Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: hcsc-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://hcsc:hcsc@127.0.0.1:5432/hcsc?sslmode=disable
      DIRECT_URL: postgresql://hcsc:hcsc@127.0.0.1:5432/hcsc?sslmode=disable
      APP_URL: https://hcsc.example.test
      SESSION_SECRET: ci-session-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      JWT_SECRET: ci-jwt-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      TWO_FACTOR_ENCRYPTION_KEY: ci-two-factor-key-0123456789-abcdefghijklmnopqrstuvwxyz
      RECOVERY_CODE_HASH_KEY: ci-recovery-key-0123456789-abcdefghijklmnopqrstuvwxyz
      INTEGRATION_ENCRYPTION_KEY: ci-integration-key-0123456789-abcdefghijklmnopqrstuvwxyz
      RESEND_API_KEY: re_ci_placeholder_key
      MAIL_FROM: HCSC CI <ci@hcsc.example.test>
      UPSTASH_REDIS_REST_URL: https://redis.hcsc.example.test
      UPSTASH_REDIS_REST_TOKEN: ci-upstash-token
      SYSTEM_OWNER_EMAIL: owner@hcsc.example.test
      HCSC_TEST_AUTH_BYPASS_ENABLED: "false"
      HCSC_SECURITY_TEST_PROVIDER: managed
      STRIX_API_BASE_URL: https://app.strix.ai/api/v1
      STRIX_API_TOKEN: ci-strix-token

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release candidate
        run: npm run ci:verify
